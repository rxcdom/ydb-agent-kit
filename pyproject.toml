[project]
name = "ydb-agent-kit"
version = "0.1.0"
description = "Reference project: hexagonal Python service on YDB with a tool-calling LLM agent."
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Only the plugins this project declares are loaded: a package that happens to
# be installed in the environment must not be able to hook the test session.
addopts = "--disable-plugin-autoload -p pytest_asyncio.plugin"
markers = [
    "integration: requires a running YDB (set YDB_ENDPOINT); skipped otherwise",
]
